work_items:
  - id: KBP-001
    title: 仓库没有任何版本历史
    status: completed
    goal: goal#kb-pipeline
    priority: P0
    required: true
    summary: >
      接管时这个仓库没有 .git——连空仓库都没有，62 个文件全部无版本管理。
      现已建立历史并推到远端。
    acceptance:
      - .gitignore 补齐 .awr/ 运行时与根目录临时产物规则。
      - 首次提交完成，工作区干净。
      - 远端建立并可被他人 clone。
    depends_on: []
    next_action: 已收口。后续发版记得 push。
    evidence:
      - "根目录清干净（初始化预览输出已移入 .tmp/）；.gitignore 补 /_* 与 .awr 运行时规则"
      - "新增 .gitattributes 强制 eol=lf"
      - "首次提交 a40f159，67 个文件；远端 git@github.com:MrSuiChuan/knowledge-base-plugin.git 的 main"
      - "从 GitHub 真克隆后跑全量：Ran 38 tests OK（当时）；克隆里 engine/core/context.py CRLF=0"

  - id: KBP-002
    title: 引擎完整性自检完全缺失
    status: completed
    goal: goal#kb-pipeline
    priority: P0
    required: true
    summary: >
      原先没有 engine/.engine-manifest.json，也没有生成器。而 /kb-setup 会把
      <插件根>/engine 复制到 .kb/engine，之后都跑这份项目内副本——它可被 agent 改写，
      却没有任何办法发现。插件的核心主张是"机器门控不可绕"，这是它最外的缺口。
    acceptance:
      - tools/generate_engine_manifest.py 产出 engine/.engine-manifest.json。
      - 引擎启动时核对 .kb/engine 副本完整性。
      - 不变量测试覆盖清单同步。
    depends_on: []
    next_action: 已收口。
    evidence:
      - "新增 tools/generate_engine_manifest.py（纯函数 build_manifest 便于测试）"
      - "kbp.py 新增 engine_selfcheck()，boot 里不一致即 engine_integrity 拒绝继续"
      - "实测：未篡改 rc=0；改掉 core/gates.py 后 rc=4 并输出 engine_integrity"
      - "tests/test_repo_invariants.py 比对清单与 engine/ 当前内容"

