  - id: KBP-005
    title: 非 Windows 装完即静默失效
    status: completed
    goal: goal#kb-pipeline
    priority: P0
    required: true
    summary: >
      hooks 硬编码 py -3；macOS/Linux 上该命令不存在 → hook 失败 → 宿主 fail-open →
      审计门/发布门全部静默失效。tools/adapt_hooks.py 还是旧的字符串替换版（无数 --check）；
      CI 只有 ubuntu 单平台，从不真实触发 hook。
    acceptance:
      - adapt_hooks.py 重写 + --check。
      - 真跑 hooks.json 里命令的测试。
      - CI 双平台 hooks job。
    depends_on: []
    next_action: 已收口。CI 首次跑过之后确认两端都执行（主 job 在 ubuntu 上会 skip 本用例，符合设计）。
    evidence:
      - "tools/adapt_hooks.py 重写：直接改 JSON 启动器词 + --check（启动器不在 PATH 返回非零）"
      - "新增 tests/test_hook_wiring.py：真跑配置里的命令；启动器缺失时 skipTest 并指向 --check"
      - "CI 新增 ubuntu+windows hooks job（先 adapt，两端都不 skip）"
      - "README 把 adapt 提为环境要求并写清 fail-open 后果"
      - "上线后 CI 的 windows 腿红：真因是 adapt_hooks.py 的中文进度行撞 cp1252（windows 运行器 stdout 被重定向时的编码）→ UnicodeEncodeError 退出 1，与启动器无关。三个 tools 脚本改为启动时重配 UTF-8；新增 ToolOutputEncodingTests 用 PYTHONIOENCODING=cp1252 显式复现。（提交 efcfd85）"
      - "同时把启动器选择从「按 OS 名假定」改成「按真实可执行性探测」"
      - "真环境复核：uv 装的真 Python 3.9.25 → 全量 55 tests OK；WSL 真 Linux → hooks job 的 adapt→check→wiring 全过"

