  - id: KBP-011
    title: 知识树审计的内容哈希对行尾脆弱
    status: completed
    goal: goal#kb-pipeline
    priority: P0
    required: true
    summary: >
      实现 KBP-002 时发现的同类 bug：audit.content_tree_hash 用 path.read_bytes() 按原始
      字节哈希。换机器或重新 checkout 导致的行尾变化会被判成"内容变了"，
      发布路径以"内容哈希不一致，请重跑审计"拦住一次语义上毫无变化的提交。
      与数开插件的引擎清单是同一个坑。
    acceptance:
      - 内容哈希对 CRLF/LF 免疫。
      - 有专门用例断言同一内容两种行尾得到同一哈希。
    depends_on: []
    next_action: 已收口。注意升级影响：旧的审计记录第一次会被判不一致，重跑一次 /kb-audit 即可（已写进 CHANGELOG）。
    evidence:
      - "新增 context.sha256_file()（行尾先归一为 LF 再哈希）"
      - "audit.content_tree_hash 改走它；generate_engine_manifest.py 也复用它"
      - "tests/test_repo_invariants.py::test_hash_is_line_ending_agnostic"

  - id: KBP-009
    title: /kb-setup 报成功，但版本控制层可能是死的
    status: completed
    goal: goal#kb-pipeline
    priority: P1
    required: true
    summary: >
      context.ensure_app_dir 末尾调 _git_init(repo)，而 _git_init 完全忽略 context.git()
      的返回值。git 不存在时 git() 返回 {"ok": False, "error": "找不到 git 可执行文件"}，
      被丢掉——/kb-setup 照样报成功，用户以为知识库已经版本化了。同类问题：能力缺失但
      安装期不报。
    acceptance:
      - /kb-setup 结束时明确报告版本控制层状态；git 缺失时给可执行的修法。
    depends_on: []
    next_action: >
      已收口。选了"明确告警但继续"：纯 mock 体验不需要 git，硬失败会挡掉只想试用的用户；
      而发布路径本来就有 git_commit 门拦着。关键是这件事现在在**安装期**就可见了。
    evidence:
      - "context._git_init 返回 git 的真实结果；新增 context.vcs_status()（可用 / 配置关闭 / git 缺失三种状态）"
      - "/kb-setup 的返回值带 vcs，实测：git 可用 -> {ok:true}；PATH 里没有 git -> {ok:false, reason:'找不到 git 可执行文件…'}"
      - "commands/setup.md 要求把 vcs 结果原样告诉用户，而不是只说初始化完成"
      - "VcsStatusTests 3 条"

  - id: KBP-010
    title: 测试反馈慢，且慢在一个可定位的点上
    status: completed
    goal: goal#kb-pipeline
    priority: P2
    required: false
    summary: >
      38 个用例要 104 秒（现在 54 个要 108 秒）。分模块实测：test_engine 21 个 48.3 秒、
      test_remote 12 个 32.4 秒、test_pipeline 5 个 27.2 秒。其中 test_engine 一个子进程
      都不起却要 2.3 秒/用例。单点：ensure_app_dir 0.744 秒（内含 git init），
      fetch_metadata 0.065 秒、latest_snapshot 0.077 秒——38 次 setUp ≈ 28 秒。
    acceptance:
      - 套件总时长明显下降，且不改变任何门控语义。
    depends_on: []
    next_action: >
      已收口，但**用的不是原计划的方案**。原计划把 git 初始化从 ensure_app_dir 里拆出来，
      那会动到发布链路的 git 行为；改成了更小的做法：提交身份由 git_commit 用 `-c` 传入，
      不在仓库配置里写两次。效果比预期好得多，所以那个更大的重构不再必要。
    evidence:
      - "分模块实测：test_engine 48.3s / test_remote 32.4s / test_pipeline 27.2s"
      - "单点计时：ensure_app_dir 0.744s（内含 git init），fetch_metadata 0.065s，latest_snapshot 0.077s"
      - "改后单点实测：ensure_app_dir 0.098 / 0.107 / 0.102s —— 约 7 倍改善（去掉两次 git config 子进程）"
      - "门控语义未变：全量 67 tests OK，git_commit / publish 行为不变"

  - id: KBP-012
    title: 跨插件同步不再静默丢失
    status: completed
    goal: goal#kb-pipeline
    priority: P0
    required: true
    summary: >
      两个 README 都写着"本插件是 data-development-plugin 的上游"，实现也在
      （sync._update_data_dev_index 往 <consumer>/.data-dev/mock/kb/index.json 写新表文档），
      但这条链一个测试都没有。补测试时发现真 bug：index.json 不存在时该函数返回
      {"ok": False, ...}，而 publish 把返回值直接丢掉了——实测 publish 报 ok:true、
      输出里一个字都没提 consumer、索引也没被创建。即"kb 先发布、ddp 后初始化"时
      同步一行没做且无人知晓。
    acceptance:
      - publish 结果里可见消费方同步状态。
      - 两侧各有对着同一份 schema 的契约测试。
      - 真跨插件端到端验证一次。
    depends_on: []
    next_action: 已收口。
    evidence:
      - "sync.publish 返回值新增 consumer_sync（未配置消费方为 null，失败带 reason），并写 consumer-sync 到 hook 日志；不判失败不回滚（git/OV 确实成功了）"
      - "commands/publish.md 写明前置条件（消费方索引必须已存在）与 ok:false 的处置"
      - "tests/test_engine.py::ConsumerContractTests 4 条：形状 / 幂等 / 缺索引必须上报 / 未配置为 null"
      - "真跨插件端到端（两侧各起进程、文件系统交接）：本插件发布后 ddp 搜到了 viking://resources/domains/user/tables/ads_user_act_di.md"
      - "消费端对应断言在 data-development-plugin 的 tests/test_kb_contract.py"

  - id: KBP-013
    title: 采集只认平台 MCP，主流实时组件没有接入点
    status: completed
    goal: goal#realtime-sources
    priority: P0
    required: true
    summary: >
      snapshot.fetch_metadata 只有两条路：mock 读 .kb/mock/meta.json，live 调
      config.cli.metadata 的 `snapshot --domain <d>`。也就是说"知识从哪来"是写死的，
      只有平台元数据 MCP 这一种形态。Kafka / Pulsar / Flink / Doris / StarRocks /
      ClickHouse 都没有那个 CLI，也没有任何地方声明它们的元数据怎么变成 6 类知识。
      结果：插件的"兼容实时组件"只能靠使用者手写 mock/meta.json——那是编的，不是采的。
    acceptance:
      - 组件注册表成为唯一事实源：组件 id、角色、采集器、必备连接键、验证层级只写在一个文件里。
      - 采集适配层把组件元数据翻译成 6 类知识契约，缺哪类要显式说明原因，不许沉默留空。
      - 未实现的采集器必须在命令层明确报错，不许返回空壳冒充"采集成功"。
    depends_on: []
    next_action: 已收口。下一步：按同一契约接 ClickHouse / Pulsar / Flink 的采集器（KBP-016 起）。
    evidence:
      - "engine/sources/registry.json：6 个组件（Kafka / Doris / StarRocks / ClickHouse / Pulsar / Flink），每个登记角色、采集器、必备连接键、tier、六类覆盖与'不适用'理由"
      - "engine/core/sources.py：contract_categories 从注册表取 6 类顺序（不再另抄一份）；registry_errors 做注册表自检；_empty_row 按契约类型建空行并写 NOT_APPLICABLE/COLLECT_FAILED"
      - "未实现采集器的组件（tier 3）调用即报 collector_not_implemented，不返回空结果：tests/test_sources.py::RegistryTests::test_registered_without_collector_refuses_loudly"
      - "缺连接键指名到键：RegistryTests::test_missing_connection_keys_are_named（missing=['bin','bootstrap_servers']）"
      - "缺失来源硬门：RegistryTests::test_unregistered_component_is_refused（describe/probe/collect 三条路径都 gate=source_unregistered）"
      - "全量 py -3 -m pytest tests -q → 80 passed（原 67 + 新增 13）"

  - id: KBP-014
    title: snapshot 的 source 是写死的，未登记来源也能混进来
    status: completed
    goal: goal#realtime-sources
    priority: P0
    required: true
    summary: >
      fetch_metadata 里 snapshot["source"] 硬编码为 "platform-mcp"，与真实来源无关；
      下游（漂移比对、发布留证、审计）都把这个字段当事实读。若接入别的来源而不改这里，
      知识库会一边记着"来自平台 MCP"、一边其实采自别处——留证撒谎比没有留证更糟。
    acceptance:
      - snapshot 的 source 由提供方决定，调用方可指定 `--source oss:<组件id>`。
      - 未在注册表登记的来源直接硬门拦下（gate=source_unregistered），不产生快照文件。
      - 来源是 mock 时不伪装成 live 来源，字段如实反映。
    depends_on: [KBP-013]
    next_action: 已收口。
    evidence:
      - "snapshot.resolve_source：显式参数 > .kb/config.json 的 snapshot.source > 按 mode 兜底（live→platform-mcp，其余→mock）"
      - "snapshot.fetch_metadata 新增 source / runner 两个入参；oss:<组件id> 走采集层并把 source 如实写进快照"
      - "未登记来源拦下且不落盘：tests/test_sources.py::SourceGateTests::test_unknown_source_is_blocked_without_writing_a_snapshot（断言快照目录仍为空）"
      - "修掉留证撒谎：mock 模式的快照原先也写 source=platform-mcp，现在写 mock —— test_mock_snapshot_does_not_disguise_itself_as_platform"
      - "来源可来自配置：test_snapshot_source_can_come_from_config"

  - id: KBP-015
    title: 采集器：Kafka（消息 / 日志存储）
    status: completed
    goal: goal#realtime-sources
    priority: P0
    required: true
    summary: >
      Kafka 是实时栈里最靠前的一环，也是"表"这个概念最弱的一环：它没有 DDL、没有调度、
      没有分区字段。所以它的价值不只是"能采"，而是**能不能诚实地说出哪几类知识不适用**——
      把 NOT_APPLICABLE 与"采失败了"分开，是这条采集层可信的前提。
    acceptance:
      - topic 列表、分区数、副本因子、保留策略、负责人/描述等能落到 BASIC_INFO/PARTITION_INFO/QUALITY_RULE。
      - 不适用于消息组件的类别写 NOT_APPLICABLE 并给理由，不写空对象。
      - 外部命令可注入（测试用桩，不依赖真 Kafka）。
    depends_on: [KBP-013]
    next_action: 已收口。已知边界：属主与消息 schema 不在 broker（前者记 unknown，后者标不适用）。
    evidence:
      - "kafka-topics.sh --describe 解析主题/分区数/副本因子/分区明细；kafka-configs.sh --describe 解析主题级配置"
      - "映射结果：BASIC_INFO（domain/layer/frequency/partitions/replication_factor）、QUALITY_RULE（retention_ms / cleanup_policy / min_insync_replicas）、PARTITION_INFO（key-hash 切分 + 保留天数）"
      - "不适用三类（COLUMN_BASIC_INFO / DDL_SQL / SCHEDULE_TASK）写进 NOT_APPLICABLE 并带理由，值按契约类型留空：tests/test_sources.py::KafkaCollectorTests::test_not_applicable_is_stated_not_faked"
      - "空主题列表不算成功：KafkaCollectorTests::test_empty_topic_list_is_not_a_success（gate=source_collect_empty）"
      - "采集失败带原始原因：KafkaCollectorTests::test_collect_failure_carries_the_raw_reason（reason 内含 Connection refused）"
      - "桩全部注入，不依赖本机装了 Kafka：kafka_runner 返回预置 stdout"

  - id: KBP-017
    title: 本地实验环境：组件探活与起停配方
    status: completed
