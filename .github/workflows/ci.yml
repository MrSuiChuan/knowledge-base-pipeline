name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # 3.9 是 README 承诺的下限，3.12 对齐主力开发机。两端都跑全量用例——
    # 否则"Python 3.9+"就是一句没人验证过的对外声明。
    # 下限改了要同步改 README；tests/test_repo_invariants.py 会核对两者一致。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q engine hooks tests tools
      # 开源标准：文件齐全 / LICENSE 与 NOTICE / 清单字段一致 / 许可头 / 无个人路径。
      # 个人路径的判定带豁免清单（自检脚本与审计报告要"描述"这些模式），所以走脚本而不是裸 rg。
      - run: python tools/validate_oss.py
      - name: provenance/secret scan
        run: |
          ! rg -n -i "xhdw|alipay|复刻|调研文档|knowledge_base" . -g '!.github/**' || exit 1
          ! rg -n "ark-[A-Za-z0-9_-]{20,}|rvk_[A-Za-z0-9_-]{20,}" . -g '!.github/**' || exit 1

  hooks:
    # 这条 job 存在的唯一理由：hook 层的失败是静默的（启动器不存在 -> 宿主 fail-open
    # -> 所有硬门失效）。必须在一个真 shell 里把 hooks.json 里的命令真跑一遍。
    #
    # 注意主 test job 里的 test_hook_wiring 在 ubuntu 上会 skip：提交默认的启动器
    # 是 Windows 的 py -3，POSIX 上没跑 adapt 之前它是"还没装好"，不是"接线坏了"。
    # 真正的跨平台接线验证在下面这条 job——它先 adapt，两端都真的执行、都不 skip。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: adapt hooks to this platform
        run: python tools/adapt_hooks.py
      - name: hook launcher must exist on this machine
        run: python tools/adapt_hooks.py --check
      - name: really invoke the configured PreToolUse hook
        run: python -m unittest tests.test_hook_wiring -v
      - name: CLI invocation decisions must not regress
        run: python -m unittest tests.test_engine.CliInvocationTests -v
